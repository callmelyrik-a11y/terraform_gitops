name: Terraform Plan

on:
  pull_request:
    branches:
    - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-aws-lab-state
  cancel-in-progress: false

jobs:
  terraform-plan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      
      - name: Debug OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );
            core.info(`OIDC sub: ${payload.sub}`);
            core.info(`OIDC aud: ${payload.aud}`);


      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
        # role-to-assume: arn:aws:iam::513329232596:role/githubactions-terraformrole
          role-to-assume: arn:aws:iam::513329232596:role/GitHubActions-Terraform-Plan-Role
          aws-region: ap-northeast-2

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        env:
          TF_VAR_public_key: ${{ vars.TF_PUBLIC_KEY }}
          TF_VAR_db_master_password: ${{ secrets.TF_VAR_DB_MASTER_PASSWORD }}
        run: terraform plan -input=false
