name: Terraform Destroy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-aws-lab-state
  cancel-in-progress: false

jobs:
  plan-destroy:
    name: Create Destroy Plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    env:
      TF_VAR_public_key: ${{ vars.TF_PUBLIC_KEY }}
      TF_VAR_db_master_password: ${{ secrets.TF_VAR_DB_MASTER_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::513329232596:role/GitHubActions-Terraform-Plan-Role
          aws-region: ap-northeast-2

      - name: Terraform Init
        run: terraform init -input=false

      - name: Create Destroy Plan
        run: terraform plan -destroy -input=false -out=destroy.tfplan

      - name: Upload Destroy Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-destroy-plan
          path: destroy.tfplan
          retention-days: 1

  destroy:
    name: Apply Destroy Plan
    needs: plan-destroy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    env:
      TF_VAR_public_key: ${{ vars.TF_PUBLIC_KEY }}
      TF_VAR_db_master_password: ${{ secrets.TF_VAR_DB_MASTER_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::513329232596:role/githubactions-terraformrole
          aws-region: ap-northeast-2

      - name: Terraform Init
        run: terraform init -input=false

      - name: Download Destroy Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-destroy-plan
          path: .

      - name: Execute Destroy
        run: terraform apply -input=false -auto-approve destroy.tfplan
